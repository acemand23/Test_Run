<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Digaball Sand Training — IG Story (1080×1920)</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Oswald:wght@500;600;700&display=swap" rel="stylesheet">
<style>
  :root{--black:#111;--red:#D30005;--grey:#6f6f71;}
  *{box-sizing:border-box;margin:0;padding:0;}
  html,body{background:#2a2a2a;}
  /* Exact IG story canvas */
  .flyer{width:1080px;height:1920px;background:#fff;color:var(--black);
         font-family:Inter,-apple-system,sans-serif;position:relative;overflow:hidden;
         display:flex;flex-direction:column;}
  .hdr{display:flex;align-items:center;justify-content:space-between;padding:70px 64px 26px;}
  .hdr img{height:66px;width:auto;display:block;}
  .tag{font-family:Oswald,sans-serif;text-transform:uppercase;font-weight:600;font-size:24px;
       letter-spacing:.16em;color:#fff;background:var(--black);padding:11px 20px;}
  .tag .r{color:var(--red);}
  /* illustration band */
  .img{position:relative;width:100%;height:770px;border-top:3px solid var(--black);border-bottom:3px solid var(--black);overflow:hidden;background:#f4f4f4;}
  .img img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;object-position:50% 12%;}
  .img .stamp{position:absolute;left:34px;bottom:30px;background:var(--red);color:#fff;font-family:Oswald,sans-serif;
              text-transform:uppercase;font-weight:700;font-size:34px;letter-spacing:.02em;padding:14px 26px;}
  /* headline block */
  .body{flex:1;display:flex;flex-direction:column;justify-content:center;padding:44px 64px;}
  .ey{font-family:Oswald,sans-serif;text-transform:uppercase;letter-spacing:.22em;font-weight:600;
      font-size:24px;color:var(--grey);display:flex;align-items:center;gap:13px;margin-bottom:26px;}
  .ey::before{content:"";width:14px;height:14px;border-radius:50%;background:var(--red);}
  .h1{font-family:Oswald,sans-serif;text-transform:uppercase;font-weight:700;font-size:150px;line-height:.86;letter-spacing:-.01em;}
  .rule{width:150px;height:12px;background:var(--red);margin:34px 0;}
  .lead{font-size:36px;line-height:1.35;color:#2c2c2c;max-width:24ch;font-weight:500;}
  /* footer */
  .ftr{background:var(--black);color:#fff;display:flex;align-items:center;gap:34px;padding:44px 64px;}
  .qr{width:170px;height:170px;background:#fff;padding:12px;flex:none;}
  .qr img{width:100%;height:100%;display:block;}
  .info{display:flex;flex-direction:column;gap:6px;}
  .info .big{font-family:Oswald,sans-serif;text-transform:uppercase;font-weight:700;font-size:50px;letter-spacing:.01em;}
  .info .sm{font-size:28px;color:#cfcfcf;}
  .creds{margin-left:auto;text-align:right;font-family:Oswald,sans-serif;text-transform:uppercase;
         font-weight:600;font-size:23px;letter-spacing:.05em;color:#bdbdbd;line-height:1.55;max-width:16ch;}
  .creds .r{color:#ff5a5f;}
</style>
</head>
<body>
<div class="flyer">
  <div class="hdr">
    <img src="assets/logo.png" alt="Digaball">
    <span class="tag">Austin,&nbsp;<span class="r">TX</span></span>
  </div>
  <!-- Coach Duke ink portrait -->
  <div class="img">
    <img src="assets/aduke.png" alt="Coach Duke" style="object-position:50% 10%;">
    <span class="stamp">Now Booking · 2026</span>
  </div>
  <div class="body">
    <div class="ey">Sand · Indoor · Outdoor</div>
    <h1 class="h1">Sand<br>Volleyball<br>Training</h1>
    <div class="rule"></div>
    <p class="lead">Private &amp; small-group coaching on the Austin sand with Coach Duke — 35+ years, AVP Pro Coach.</p>
  </div>
  <div class="ftr">
    <div class="qr"><img src="assets/qr.png" alt="Scan for digaball.com"></div>
    <div class="info">
      <span class="big">digaball.com</span>
      <!-- TODO: confirm real training-inquiry email with Coach Duke -->
      <span class="sm">info@digaball.com</span>
    </div>
    <div class="creds">UT Gold 2000 / Silver 2014 · <span class="r">AVP</span> Pro Coach</div>
  </div>
</div>
</body>
</html>
