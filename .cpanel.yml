---
# cPanel Git Version Control deployment.
# If this repo's server checkout is managed by cPanel Git, clicking "Deploy
# HEAD Commit" (or an auto-deploy-on-update hook) runs these tasks, which copy
# ONLY the Digaball V4 flagship into public_html (see deploy/deploy-to-prod.sh).
# Sibling folders (beta/, other subsites) are never touched.
#
# If instead the checkout is a plain `git clone` that auto-pulls, ignore this
# file and use the cron in deploy/README.md.
deployment:
  tasks:
    - /bin/bash deploy/deploy-to-prod.sh
