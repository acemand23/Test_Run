<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Drawful v1 · Big Screen</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>
<div id="timer" class="timer hidden">–</div>
<div id="app" class="center"><div class="spin"></div><div class="muted">Connecting…</div></div>

<script>
const app = document.getElementById('app');
const timerEl = document.getElementById('timer');
let ws, state = null, savedCode = sessionStorage.getItem('drawful_host_code'), hb = null;

function connect(){
  ws = new WebSocket((location.protocol==='https:'?'wss://':'ws://')+location.host);
  ws.onopen = () => {
    if (savedCode) ws.send(JSON.stringify({t:'host_attach', code:savedCode}));
    else ws.send(JSON.stringify({t:'host_create'}));
    clearInterval(hb); hb = setInterval(() => { if (ws && ws.readyState===1) ws.send('{"t":"hb"}'); }, 15000);
  };
  ws.onmessage = (e) => {
    const m = JSON.parse(e.data);
    if (m.t === 'hosted'){ savedCode = m.code; sessionStorage.setItem('drawful_host_code', m.code); }
    if (m.t === 'state'){ state = m.view; render(); }
    if (m.t === 'error'){ // stale room -> start fresh
      sessionStorage.removeItem('drawful_host_code'); savedCode=null;
      ws.send(JSON.stringify({t:'host_create'}));
    }
  };
  ws.onclose = () => { clearInterval(hb); setTimeout(connect, 1500); };
}
const send = (o) => ws && ws.readyState===1 && ws.send(JSON.stringify(o));
connect();

// ---- countdown ----
let tick;
function runTimer(deadline){
  clearInterval(tick);
  if (!deadline){ timerEl.classList.add('hidden'); return; }
  const upd = () => {
    const s = Math.max(0, Math.round((deadline - Date.now())/1000));
    timerEl.textContent = s;
    timerEl.classList.remove('hidden');
    timerEl.classList.toggle('warn', s <= 10);
    if (s<=0) clearInterval(tick);
  };
  upd(); tick = setInterval(upd, 250);
}

const esc = (s) => (s||'').replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const joinURL = () => location.origin + '/play.html';

function playerChips(list){
  return `<div class="players">${list.map(p=>`
    <div class="chip ${p.done?'done':''} ${p.connected?'':'off'}">
      <span class="dot" style="background:${p.color}"></span>${esc(p.name)}
      ${p.done?'<span class="check">✓</span>':''}
    </div>`).join('')}</div>`;
}

function render(){
  if (!state) return;
  runTimer(state.deadline);
  const P = state.phase;
  if (P==='lobby') return renderLobby();
  if (P==='drawing') return renderDrawing();
  if (P==='answering') return renderAnswering();
  if (P==='voting') return renderVoting();
  if (P==='reveal') return renderReveal();
  if (P==='roundscores') return renderScores(false);
  if (P==='gameover') return renderScores(true);
}

function renderLobby(){
  const enough = state.players.filter(p=>p.connected).length >= 2;
  app.className='wrap';
  app.innerHTML = `
  <div style="text-align:center;display:flex;flex-direction:column;gap:8px;align-items:center">
    <div class="pill">Join at</div>
    <div class="big">${esc(joinURL())}</div>
    <div class="muted" style="font-weight:700;margin-top:6px">Game code</div>
    <div class="code" style="font-size:clamp(64px,16vw,160px)">${state.code}</div>
    <div style="margin:18px 0">${playerChips(state.players)}</div>
    <div class="muted" style="font-weight:800">${state.players.length}/8 players joined</div>
    <div class="card" style="margin-top:18px;display:flex;gap:16px;align-items:center;flex-wrap:wrap;justify-content:center">
      <label class="lbl" style="margin:0">Prompts
        <select id="mode" class="field" style="width:auto;padding:10px 14px;margin-left:8px">
          <option value="adult" selected>🔞 After Dark (18+)</option>
          <option value="mixed">😏 Mixed</option>
          <option value="clean">😇 Party (clean)</option>
        </select>
      </label>
      <label class="lbl" style="margin:0">Rounds
        <select id="rounds" class="field" style="width:auto;padding:10px 14px;margin-left:8px">
          <option value="1">1</option><option value="2" selected>2</option><option value="3">3</option>
        </select>
      </label>
      <button class="btn green lg" id="start" ${enough?'':'disabled'}>▶ Start game</button>
    </div>
    <div class="muted" style="margin-top:8px;font-size:13px">🔞 After Dark contains crude, adult humor — 18+ players only.</div>
    ${enough?'':'<div class="muted" style="margin-top:6px">Need at least 2 players to start</div>'}
  </div>`;
  document.getElementById('start').onclick = () =>
    send({t:'start', settings:{rounds:+document.getElementById('rounds').value, mode:document.getElementById('mode').value}});
}

function renderDrawing(){
  app.className='wrap';
  app.innerHTML = `<div class="center" style="min-height:80dvh">
    <div class="pill">Round ${state.round} of ${state.rounds}</div>
    <h1 class="big">✏️ Draw your prompt!</h1>
    <p class="muted" style="font-weight:700;font-size:20px">Each player has a secret thing to draw on their phone.</p>
    ${playerChips(state.players)}
  </div>`;
}

function drawingStage(caption, extra=''){
  app.className='wrap';
  app.innerHTML = `<div class="center" style="min-height:86dvh;gap:14px">
    <div class="pill">Drawing ${state.drawing.idx} / ${state.drawing.total} · Round ${state.round}/${state.rounds}</div>
    <img class="drawimg" src="${state.drawing.img}" alt="drawing">
    <h2 class="big">${caption}</h2>
    ${extra}
  </div>`;
}
function renderAnswering(){
  drawingStage('🤥 Write a fake answer on your phone!', playerChips(state.players));
}
function renderVoting(){
  const choices = (state.choices||[]).map((c,i)=>`
    <div class="choice" style="cursor:default"><span class="num">${i+1}</span>${esc(c.text)}</div>`).join('');
  app.className='wrap';
  app.innerHTML = `<div class="center" style="min-height:88dvh;gap:18px">
    <div class="pill">Drawing ${state.drawing.idx} / ${state.drawing.total} · Round ${state.round}/${state.rounds}</div>
    <h2 class="big">🗳️ Which one is the truth? Vote on your phones!</h2>
    <div class="vote-layout">
      <img class="drawimg" style="width:min(52vh,42vw)" src="${state.drawing.img}" alt="drawing">
      <div class="choices">${choices}</div>
    </div>
    ${playerChips(state.players)}
  </div>`;
}

function renderReveal(){
  const r = state.results;
  const choices = r.choices.map(c=>`
    <div class="reveal-choice ${c.isTruth?'truth':''}">
      <div class="rc-top">
        <span class="rc-text">${esc(c.text)} ${c.isTruth?'✅ <span class="muted">(the truth)</span>':''}</span>
        <span class="rc-by">${c.isTruth?'':(c.authors.length?'lie by '+esc(c.authors.join(', ')):'')}</span>
      </div>
      ${c.voters.length?`<div class="rc-voters">${c.isTruth?'guessed by ':'fooled '}${esc(c.voters.join(', '))}</div>`:''}
    </div>`).join('');
  const deltas = r.deltas.map(d=>`<div class="chip done"><span class="dot" style="background:var(--green)"></span>${esc(d.name)} +${d.points}</div>`).join('');
  app.className='wrap';
  app.innerHTML = `<div class="center" style="min-height:90dvh;gap:16px">
    <div class="grid2" style="width:min(1000px,96vw);align-items:center">
      <div style="text-align:center"><img class="drawimg" style="width:min(46vh,88vw)" src="${r.img}">
        <div class="artistline" style="margin-top:10px">by <b>${esc(r.artistName)}</b></div></div>
      <div style="display:flex;flex-direction:column;gap:10px">${choices}</div>
    </div>
    <h2 class="big">The answer was: <span style="color:var(--green)">${esc(r.truth)}</span></h2>
    ${deltas?`<div class="players">${deltas}</div>`:'<div class="muted">Nobody scored — brutal.</div>'}
    <button class="btn blue lg" id="next">Next ▶</button>
  </div>`;
  document.getElementById('next').onclick = () => send({t:'next'});
}

function renderScores(final){
  const lb = state.leaderboard;
  app.className='wrap';
  app.innerHTML = `<div class="center" style="min-height:88dvh;gap:20px">
    <h1 class="logo" style="font-size:clamp(34px,7vw,72px)">${final?'🏆 Final Scores':'Scoreboard'}</h1>
    ${final?`<div class="big">Winner: <span style="color:var(--yellow)">${esc(lb[0].name)}</span> 🎉</div>`:`<div class="pill">After round ${state.round} of ${state.rounds}</div>`}
    <ol class="lb">${lb.map(p=>`<li class="${p.rank===1?'first':''}">
      <span class="rank">${p.rank}</span>
      <span class="nm"><span class="dot" style="width:16px;height:16px;border-radius:50%;background:${p.color}"></span>${esc(p.name)}</span>
      <span class="sc">${p.score}</span></li>`).join('')}</ol>
    ${final
      ? `<button class="btn green lg" id="again">Play again</button>`
      : `<button class="btn blue lg" id="next">Next round ▶</button>`}
  </div>`;
  const n = document.getElementById('next'); if (n) n.onclick=()=>send({t:'next'});
  const a = document.getElementById('again'); if (a) a.onclick=()=>send({t:'play_again'});
}
</script>
</body>
</html>
