<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>The Big Draw — Volleyball for Good</title>
<link rel="stylesheet" href="css/poster.css?v=2">
</head>
<body>

<!-- v3 start: the event poster, used as-is, with clickable hotspots layered on top.
     Coordinates are % of the image (1024x1536) so they scale at any width.
     Visit this page with #edit in the URL to see/adjust the hotspot boxes. -->
<div class="poster" id="poster">
  <img class="poster-img"
       src="assets/poster.png"
       alt="The Big Draw — Blind Draw beach volleyball tournament, November 1st at Aussies Grill & Beach Bar. Volleyball for Good, benefiting Big Brothers Big Sisters. Register now. Sponsorship packages available.">

  <!-- top-right pill -->
  <a class="hot" data-label="Sponsor Now" href="#sponsor"
     style="left:81.5%;top:1.4%;width:16.8%;height:3.1%"></a>

  <!-- hero CTA -->
  <a class="hot" data-label="Register Now" href="https://vballmanager.com/"
     style="left:5.3%;top:37.9%;width:33%;height:5%"></a>

  <!-- sponsorship block -> contact -->
  <a class="hot" id="sponsor" data-label="Sponsorship inquiry" href="mailto:questions@tbdvolleyball.com?subject=The%20Big%20Draw%20Sponsorship"
     style="left:4%;top:61.5%;width:92%;height:30%"></a>
</div>

<script>
  // #edit reveals the hotspot boxes so positions are easy to fine-tune
  function syncEdit(){ document.getElementById('poster').classList.toggle('edit', location.hash === '#edit'); }
  addEventListener('hashchange', syncEdit); syncEdit();
</script>

</body>
</html>
