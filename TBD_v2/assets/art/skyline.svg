<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="360" viewBox="0 0 1280 360" preserveAspectRatio="xMaxYMax meet">
  <defs>
    <linearGradient id="water" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2bb6c9"/><stop offset="1" stop-color="#2563EB"/>
    </linearGradient>
    <pattern id="win" width="18" height="22" patternUnits="userSpaceOnUse">
      <rect x="5" y="6" width="7" height="9" fill="#FFD23F" opacity="0.55"/>
    </pattern>
    <g id="bld">
      <rect x="70"  y="170" width="46" height="130" fill="#E5388C"/>
      <rect x="120" y="140" width="40" height="160" fill="#6D28D9"/>
      <rect x="164" y="200" width="54" height="100" fill="#15A88C"/>
      <rect x="222" y="120" width="38" height="180" fill="#2563EB"/>
      <rect x="239" y="90"  width="5"  height="30"  fill="#2563EB"/>
      <rect x="264" y="175" width="48" height="125" fill="#F26522"/>
      <rect x="316" y="150" width="40" height="150" fill="#F6A91B"/>
      <rect x="360" y="95"  width="60" height="205" fill="#6D28D9"/>
      <rect x="378" y="78"  width="24" height="17"  fill="#6D28D9"/>
      <rect x="387" y="58"  width="6"  height="20"  fill="#6D28D9"/>
      <rect x="424" y="165" width="44" height="135" fill="#E5388C"/>
      <rect x="472" y="210" width="38" height="90"  fill="#15A88C"/>
      <rect x="514" y="130" width="56" height="170" fill="#4F46E5"/>
      <rect x="538" y="104" width="6"  height="26"  fill="#4F46E5"/>
      <rect x="574" y="185" width="42" height="115" fill="#F26522"/>
      <rect x="620" y="110" width="50" height="190" fill="#2563EB"/>
      <rect x="632" y="92"  width="26" height="18"  fill="#2563EB"/>
      <rect x="643" y="72"  width="5"  height="20"  fill="#2563EB"/>
      <rect x="674" y="200" width="40" height="100" fill="#F472B6"/>
      <rect x="718" y="150" width="58" height="150" fill="#6D28D9"/>
      <rect x="780" y="185" width="44" height="115" fill="#15A88C"/>
      <rect x="828" y="125" width="50" height="175" fill="#E5388C"/>
      <rect x="851" y="98"  width="5"  height="27"  fill="#E5388C"/>
      <rect x="882" y="205" width="40" height="95"  fill="#F6A91B"/>
      <rect x="926" y="160" width="56" height="140" fill="#2563EB"/>
      <rect x="986" y="185" width="46" height="115" fill="#F26522"/>
      <rect x="1036" y="140" width="54" height="160" fill="#6D28D9"/>
      <rect x="1094" y="200" width="40" height="100" fill="#15A88C"/>
    </g>
    <clipPath id="bclip"><use href="#bld"/></clipPath>
  </defs>

  <!-- trees along the bank -->
  <g>
    <ellipse cx="150" cy="296" rx="16" ry="14" fill="#1f8f5f"/>
    <ellipse cx="600" cy="298" rx="13" ry="12" fill="#1f8f5f"/>
    <ellipse cx="1010" cy="297" rx="15" ry="13" fill="#1f8f5f"/>
  </g>

  <!-- buildings + window texture -->
  <use href="#bld"/>
  <rect x="60" y="90" width="1090" height="210" fill="url(#win)" clip-path="url(#bclip)"/>

  <!-- bridge over the river -->
  <g>
    <rect x="130" y="286" width="430" height="7" fill="#4a3a78"/>
    <rect x="130" y="293" width="430" height="9" fill="#5b4b8a"/>
    <g fill="#2bb6c9">
      <ellipse cx="170" cy="302" rx="26" ry="11"/><ellipse cx="240" cy="302" rx="26" ry="11"/>
      <ellipse cx="310" cy="302" rx="26" ry="11"/><ellipse cx="380" cy="302" rx="26" ry="11"/>
      <ellipse cx="450" cy="302" rx="26" ry="11"/><ellipse cx="520" cy="302" rx="26" ry="11"/>
    </g>
  </g>

  <!-- river -->
  <rect x="0" y="300" width="1280" height="60" fill="url(#water)" opacity="0.9"/>
  <!-- reflections -->
  <g opacity="0.22">
    <rect x="360" y="300" width="60" height="40" fill="#6D28D9"/>
    <rect x="514" y="300" width="56" height="34" fill="#4F46E5"/>
    <rect x="620" y="300" width="50" height="38" fill="#2563EB"/>
    <rect x="828" y="300" width="50" height="32" fill="#E5388C"/>
    <rect x="1036" y="300" width="54" height="30" fill="#6D28D9"/>
  </g>
  <g stroke="#bfeefc" stroke-width="2" opacity="0.5">
    <line x1="40" y1="318" x2="300" y2="318"/>
    <line x1="700" y1="330" x2="980" y2="330"/>
  </g>
</svg>
